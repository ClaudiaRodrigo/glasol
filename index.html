<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glasol | Bienvenidos</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f8f9fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px;
      margin: 0;
    }
    
    
    /* Título o hueco para el logo */
    .brand-title {
      color: #005b9f;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 40px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Estilo de los botones */
    .btn {
      display: block;
      width: 100%;
      max-width: 320px;
      background-color: #005b9f;
      color: white;
      text-align: center;
      padding: 16px;
      margin-bottom: 15px;
      text-decoration: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
      background-color: #00467a;
    }

    /* Botón de reseñas con color diferente para destacar */
    .btn-review {
      background-color: #fbbc05;
      color: #333;
    }
    
    .btn-review:active {
      background-color: #e5a800;
    }
  </style>
</head>
