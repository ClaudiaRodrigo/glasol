<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glasol | Bienvenidos</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #FF751D; /* Fondo naranja que has elegido */
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px;
      margin: 0;
    }

    .brand-logo {
      width: 100%;
      max-width: 250px;
      margin-bottom: 40px;
    }

    .btn {
      display: block;
      width: 100%;
      max-width: 320px;
      background-color: #ffffff; /* Botones blancos */
      color: #005b9f; /* Letra azul */
      text-align: center;
      padding: 16px;
      margin-bottom: 15px;
      text-decoration: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
      background-color: #f0f0f0;
    }

    /* Botón de reseñas en amarillo para llamar la atención */
    .btn-review {
      background-color: #fbbc05;
      color: #121212;
    }
    
    .btn-review:active {
      background-color: #e5a800;
    }

    /* Botón de Instagram: Forma diferente y más separado */
    .btn-insta {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: #ffffff;
      margin-top: 45px; /* Mucho más separado del bloque de arriba */
      border-radius: 50px; /* Forma de píldora (totalmente redondeado) */
      padding: 12px 25px; /* Un poco más fino */
      width: 80%; /* Más estrecho que los otros botones */
      max-width: 280px;
      border: 2px solid #ffffff; /* Borde blanco para destacar sobre tu fondo naranja */
      box-shadow: 0 6px 12px rgba(0,0,0,0.15); /* Sombra un pelín más marcada */
    }

    .btn-insta:active {
      opacity: 0.8;
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <!-- Logo de Glasol con enlace a la web principal -->
  <a href="https://glasolheladerias.com" target="_blank">
    <img src="logo.png" alt="Logo Glasol" class="brand-logo">
  </a>

  <!-- Botón 1: La Carta -->
  <a href="carta-glasol.pdf" class="btn">🍦 Ver Carta</a>
  
  <!-- Botón 2: Alérgenos -->
  <a href="alergenos-glasol.pdf" class="btn">⚠️ Info. Alérgenos</a>

  <!-- Botón 3: Reseñas -->
  <a href="https://search.google.com/local/writereview?placeid=ChIJ71r8BwBFYA0RCRLXBQT--Vc" class="btn btn-review" target="_blank">⭐ Déjanos una reseña</a>

  <!-- Botón 4: Instagram -->
  <a href="https://www.instagram.com/glasol_paterna/" class="btn btn-insta" target="_blank">📸 Síguenos en Instagram</a>

</body>
</html>
